<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editId != null ? '編輯開發資料' : '新增潛在客戶'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4" style="max-width: 960px;">
    <h4 class="mb-3">
        <i data-lucide="user-search"></i>
        <span th:text="${editId != null ? '編輯開發資料' : '新增潛在客戶'}">新增潛在客戶</span>
    </h4>

    <form method="post"
          th:action="${editId != null} ? @{/leads/{id}(id=${editId})} : @{/leads}"
          th:object="${leadForm}">

        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <div class="fw-bold mb-1"><i data-lucide="triangle-alert"></i> 請修正以下問題:</div>
            <ul class="mb-0"><li th:each="e : ${#fields.errors('*')}" th:text="${e}"></li></ul>
        </div>

        <div class="card card-body">
            <!-- 基本資料 -->
            <div class="form-section-title">基本資料</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">公司名稱</label>
                    <input class="form-control" th:field="*{companyName}"
                           th:classappend="${#fields.hasErrors('companyName')}?'is-invalid'">
                </div>
                <div class="col-md-3">
                    <label class="form-label">國家</label>
                    <input class="form-control" th:field="*{country}" list="leadCountryList" placeholder="例:Vietnam">
                    <datalist id="leadCountryList">
                        <option th:each="c : ${countries}" th:value="${c}"></option>
                    </datalist>
                </div>
                <div class="col-md-3">
                    <label class="form-label">城市</label>
                    <input class="form-control" th:field="*{city}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">商業型態</label>
                    <input class="form-control" th:field="*{businessType}" placeholder="自由輸入">
                </div>
                <div class="col-md-4">
                    <label class="form-label">官網</label>
                    <input class="form-control" th:field="*{website}" placeholder="https://...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">公開 Email</label>
                    <input class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')}?'is-invalid'">
                </div>
                <div class="col-md-4">
                    <label class="form-label">電話 / Zalo</label>
                    <input class="form-control" th:field="*{phoneZalo}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">聯絡方式</label>
                    <input class="form-control" th:field="*{contactRoute}" placeholder="官網表單 / Email / Zalo">
                </div>
            </div>

            <!-- 評分與分級 -->
            <div class="form-section-title">評分與分級</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">客戶類型</label>
                    <select class="form-select" th:field="*{leadType}">
                        <option value="">(未指定)</option>
                        <option th:each="t : ${leadTypes}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">評分(0–100)</label>
                    <input type="number" min="0" max="100" class="form-control" th:field="*{score}"
                           th:classappend="${#fields.hasErrors('score')}?'is-invalid'">
                </div>
                <div class="col-md-2">
                    <label class="form-label">優先級</label>
                    <select class="form-select" th:field="*{priority}">
                        <option value="">—</option>
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">快速成交</label>
                    <select class="form-select" th:field="*{fastDeal}">
                        <option value="">—</option>
                        <option th:each="f : ${fastDeals}" th:value="${f}" th:text="${f}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">品牌衝突</label>
                    <select class="form-select" th:field="*{brandConflict}">
                        <option value="">(未指定)</option>
                        <option th:each="b : ${brandConflicts}" th:value="${b}" th:text="${b}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">查核程度</label>
                    <input class="form-control" th:field="*{verification}" placeholder="自由輸入">
                </div>
                <div class="col-12">
                    <label class="form-label">Source URL 來源</label>
                    <input class="form-control" th:field="*{sourceUrl}">
                </div>
            </div>

            <!-- 開發策略 -->
            <div class="form-section-title">開發策略</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">切入產品</label>
                    <select class="form-select" th:field="*{targetProduct}">
                        <option value="">(未指定)</option>
                        <option th:each="tp : ${targetProducts}" th:value="${tp}" th:text="${tp}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">客製化切入點</label>
                    <select class="form-select" th:field="*{customAngle}">
                        <option value="">(未指定)</option>
                        <option th:each="ca : ${customAngles}" th:value="${ca}" th:text="${ca}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">建議主旨(寄信用)</label>
                    <input class="form-control" th:field="*{suggestedSubject}">
                </div>
            </div>

            <!-- 開發進度 -->
            <div class="form-section-title">開發進度</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">開發進度</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="">(未指定)</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">首次開發</label>
                    <input type="date" class="form-control" th:field="*{firstContactDate}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">最近開發</label>
                    <input type="date" class="form-control" th:field="*{latestContactDate}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">下一步</label>
                    <select class="form-select" th:field="*{nextStep}">
                        <option value="">(未指定)</option>
                        <option th:each="n : ${nextSteps}" th:value="${n}" th:text="${n}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">備註</label>
                    <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                </div>
            </div>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i data-lucide="check"></i> 儲存</button>
            <a class="btn btn-outline-secondary"
               th:href="${editId != null} ? @{/leads/{id}(id=${editId})} : @{/leads}">取消</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
