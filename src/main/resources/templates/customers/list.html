<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('客戶列表')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i data-lucide="users"></i> 客戶列表</h4>
        <a class="btn btn-primary" th:href="@{/customers/new}"><i data-lucide="user-plus"></i> 新增客戶</a>
    </div>

    <!-- 搜尋列 -->
    <form class="card card-body mb-3" method="get" th:action="@{/customers}">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label small text-muted">關鍵字(公司名稱 / 客戶編號 / 聯絡人)</label>
                <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="輸入關鍵字搜尋">
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="activeOnly" value="true"
                           id="activeOnly" th:checked="${activeOnly}">
                    <label class="form-check-label" for="activeOnly">只顯示啟用中</label>
                </div>
            </div>
            <div class="col-md-3 text-end">
                <button class="btn btn-outline-primary" type="submit"><i data-lucide="search"></i> 搜尋</button>
                <a class="btn btn-outline-secondary" th:href="@{/customers}">清除</a>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>客戶編號</th>
                    <th>公司名稱</th>
                    <th>國家 / 城市</th>
                    <th>類型</th>
                    <th>電話</th>
                    <th>最後聯絡</th>
                    <th>狀態</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.customerCode}">C001</td>
                    <td>
                        <a th:href="@{/customers/{id}(id=${c.id})}" th:text="${c.companyName}"
                           class="text-decoration-none fw-semibold">公司</a>
                    </td>
                    <td>
                        <span th:text="${c.country}"></span>
                        <span th:if="${c.city}" class="text-muted" th:text="' · ' + ${c.city}"></span>
                    </td>
                    <td th:text="${c.customerType != null ? c.customerType.label : ''}">一般客戶</td>
                    <td th:text="${c.phone}">02-1234</td>
                    <td class="text-nowrap" th:with="days=${c.lastContactedAt != null ? T(java.time.temporal.ChronoUnit).DAYS.between(c.lastContactedAt, T(java.time.LocalDateTime).now()) : null}">
                        <span th:if="${c.lastContactedAt != null}"
                              th:text="${#temporals.format(c.lastContactedAt,'yyyy-MM-dd HH:mm')}">2026-07-01</span>
                        <span th:if="${days != null}" class="day-badge"
                              th:classappend="${days <= 7} ? 'day-green' : (${days <= 14} ? 'day-amber' : 'day-red')"
                              th:text="${days == 0 ? '今天' : (days + ' 天')}">N 天</span>
                        <span th:unless="${c.lastContactedAt != null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${c.active}" class="badge text-bg-success">啟用</span>
                        <span th:unless="${c.active}" class="badge text-bg-secondary">停用</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/customers/{id}(id=${c.id})}">
                            <i data-lucide="eye"></i></a>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/customers/{id}/edit(id=${c.id})}">
                            <i data-lucide="pencil"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="8" class="text-center text-muted py-4">查無客戶資料</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- 分頁 -->
    <nav class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <form method="get" th:action="@{/customers}" class="d-flex align-items-center gap-2">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="activeOnly" th:value="${activeOnly}">
            <span class="text-muted small">共 <span th:text="${page.totalElements}">0</span> 筆</span>
            <label class="text-muted small mb-0">每頁</label>
            <select class="form-select form-select-sm" style="width:auto" name="size" onchange="this.form.submit()">
                <option value="10" th:selected="${pageSize==10}">10</option>
                <option value="20" th:selected="${pageSize==20}">20</option>
                <option value="50" th:selected="${pageSize==50}">50</option>
            </select>
        </form>
        <ul class="pagination pagination-sm mb-0" th:if="${page.totalPages > 1}">
            <li class="page-item" th:classappend="${page.first}?'disabled'">
                <a class="page-link" th:href="@{/customers(page=${page.number-1},size=${pageSize},keyword=${keyword},activeOnly=${activeOnly})}">上一頁</a>
            </li>
            <li class="page-item disabled"><span class="page-link"
                th:text="'第 ' + (${page.number+1}) + ' / ' + ${page.totalPages} + ' 頁'">第 1 頁</span></li>
            <li class="page-item" th:classappend="${page.last}?'disabled'">
                <a class="page-link" th:href="@{/customers(page=${page.number+1},size=${pageSize},keyword=${keyword},activeOnly=${activeOnly})}">下一頁</a>
            </li>
        </ul>
    </nav>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
