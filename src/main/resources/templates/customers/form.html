<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editId != null ? '編輯客戶' : '新增客戶'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4" style="max-width: 900px;">
    <h4 class="mb-3">
        <i data-lucide="contact"></i>
        <span th:text="${editId != null ? '編輯客戶' : '新增客戶'}">新增客戶</span>
    </h4>

    <!-- 依是否編輯決定送出網址 -->
    <form method="post"
          th:action="${editId != null} ? @{/customers/{id}(id=${editId})} : @{/customers}"
          th:object="${customerForm}">

        <div class="card card-body">
            <div class="form-section-title">基本資料</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label required">客戶編號</label>
                    <input type="text" class="form-control" th:field="*{customerCode}"
                           th:classappend="${#fields.hasErrors('customerCode')}?'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('customerCode')}"
                         th:errors="*{customerCode}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label required">公司名稱</label>
                    <input type="text" class="form-control" th:field="*{companyName}"
                           th:classappend="${#fields.hasErrors('companyName')}?'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}"
                         th:errors="*{companyName}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">統一編號</label>
                    <input type="text" class="form-control" th:field="*{taxId}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">公司電話</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">公司傳真</label>
                    <input type="text" class="form-control" th:field="*{fax}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">公司 Email</label>
                    <input type="text" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')}?'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">公司地址</label>
                    <input type="text" class="form-control" th:field="*{address}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">國家</label>
                    <input type="text" class="form-control" th:field="*{country}" list="countryList" placeholder="例:USA">
                    <datalist id="countryList">
                        <option value="Taiwan"></option><option value="USA"></option>
                        <option value="China"></option><option value="Japan"></option>
                        <option value="Germany"></option><option value="South Korea"></option>
                        <option value="Vietnam"></option><option value="Thailand"></option>
                        <option value="Malaysia"></option><option value="Singapore"></option>
                        <option value="Canada"></option><option value="United Kingdom"></option>
                        <option value="France"></option><option value="Netherlands"></option>
                        <option value="Australia"></option><option value="India"></option>
                        <option value="Mexico"></option><option value="Italy"></option>
                    </datalist>
                </div>
                <div class="col-md-3">
                    <label class="form-label">城市</label>
                    <input type="text" class="form-control" th:field="*{city}" placeholder="例:Los Angeles">
                </div>
            </div>

            <div class="form-section-title">分類資訊</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">客戶類型</label>
                    <select class="form-select" th:field="*{customerType}">
                        <option th:each="t : ${customerTypes}" th:value="${t}" th:text="${t.label}">類型</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">所屬產業</label>
                    <input type="text" class="form-control" th:field="*{industry}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">客戶來源</label>
                    <input type="text" class="form-control" th:field="*{source}">
                </div>
                <div class="col-12">
                    <label class="form-label">備註</label>
                    <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="active">
                        <label class="form-check-label" for="active">啟用此客戶</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{followUpEnabled}" id="followUpEnabled">
                        <label class="form-check-label" for="followUpEnabled">
                            納入跟進提醒(勾選後,這家太久沒聯絡時會出現在通知中心)
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i data-lucide="check"></i> 儲存</button>
            <a class="btn btn-outline-secondary"
               th:href="${editId != null} ? @{/customers/{id}(id=${editId})} : @{/customers}">取消</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
