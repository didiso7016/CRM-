<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('客戶詳細資料')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">
            <i data-lucide="building-2"></i> <span th:text="${customer.companyName}">公司名稱</span>
            <span th:if="${customer.active}" class="badge text-bg-success align-middle">啟用</span>
            <span th:unless="${customer.active}" class="badge text-bg-secondary align-middle">停用</span>
        </h4>
        <div class="d-flex gap-2">
            <!-- 啟用 / 停用(移到公司名稱旁,較好按)-->
            <form th:if="${customer.active}" method="post" class="confirm-action"
                  data-confirm-message="確定要停用此客戶嗎?(歷史報價仍可查看)"
                  th:action="@{/customers/{id}/deactivate(id=${customer.id})}">
                <button class="btn btn-outline-danger" type="submit"><i data-lucide="circle-slash"></i> 停用</button>
            </form>
            <form th:unless="${customer.active}" method="post"
                  th:action="@{/customers/{id}/activate(id=${customer.id})}">
                <button class="btn btn-outline-success" type="submit"><i data-lucide="circle-check"></i> 重新啟用</button>
            </form>
            <!-- 跟進提醒開關(挪到上方)-->
            <form method="post" th:action="@{/customers/{id}/follow-up(id=${customer.id})}">
                <input type="hidden" name="enabled" th:value="${!customer.followUpEnabled}">
                <button type="submit" class="btn"
                        th:classappend="${customer.followUpEnabled} ? 'btn-outline-secondary' : 'btn-outline-primary'">
                    <i th:attr="data-lucide=${customer.followUpEnabled ? 'bell-off' : 'bell'}"></i>
                    <span th:text="${customer.followUpEnabled ? '停止跟進提醒' : '納入跟進提醒'}">納入跟進提醒</span>
                </button>
            </form>
            <a class="btn btn-outline-secondary" th:href="@{/customers}"><i data-lucide="arrow-left"></i> 返回列表</a>
            <a class="btn btn-success" th:href="@{/quotations/new(customerId=${customer.id})}">
                <i data-lucide="plus"></i> 建立報價單</a>
        </div>
    </div>

    <div class="row g-3">
        <!-- 基本資料 -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i data-lucide="info"></i> 基本資料</span>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/customers/{id}/edit(id=${customer.id})}">
                        <i data-lucide="pencil"></i> 編輯</a>
                </div>
                <div class="card-body">
                    <table class="table table-sm mb-0">
                        <tr><th class="text-muted" style="width:35%">客戶編號</th><td th:text="${customer.customerCode}"></td></tr>
                        <tr><th class="text-muted">統一編號</th><td th:text="${customer.taxId}"></td></tr>
                        <tr><th class="text-muted">客戶類型</th><td th:text="${customer.customerType != null ? customer.customerType.label : ''}"></td></tr>
                        <tr><th class="text-muted">所屬產業</th><td th:text="${customer.industry}"></td></tr>
                        <tr><th class="text-muted">客戶來源</th><td th:text="${customer.source}"></td></tr>
                        <tr><th class="text-muted">電話</th><td th:text="${customer.phone}"></td></tr>
                        <tr><th class="text-muted">傳真</th><td th:text="${customer.fax}"></td></tr>
                        <tr><th class="text-muted">Email</th><td th:text="${customer.email}"></td></tr>
                        <tr><th class="text-muted">國家 / 城市</th>
                            <td>
                                <span th:text="${customer.country}"></span>
                                <span th:if="${customer.city}" th:text="' · ' + ${customer.city}"></span>
                            </td></tr>
                        <tr><th class="text-muted">地址</th><td th:text="${customer.address}"></td></tr>
                        <tr><th class="text-muted">預設幣別</th><td th:text="${customer.defaultCurrency}"></td></tr>
                        <tr><th class="text-muted">預設付款條件</th><td th:text="${customer.defaultPaymentTerms}"></td></tr>
                        <tr><th class="text-muted">預設交貨條件</th><td th:text="${customer.defaultDeliveryTerms}"></td></tr>
                        <tr><th class="text-muted">備註</th><td th:text="${customer.notes}"></td></tr>
                        <tr><th class="text-muted">最後聯絡</th>
                            <td class="text-nowrap" th:with="days=${customer.lastContactedAt != null ? T(java.time.temporal.ChronoUnit).DAYS.between(customer.lastContactedAt, T(java.time.LocalDateTime).now()) : null}">
                                <span th:if="${customer.lastContactedAt != null}"
                                      th:text="${#temporals.format(customer.lastContactedAt,'yyyy-MM-dd HH:mm')}"></span>
                                <span th:if="${days != null}" class="day-badge"
                                      th:classappend="${days <= 7} ? 'day-green' : (${days <= 14} ? 'day-amber' : 'day-red')"
                                      th:text="${days == 0 ? '今天聯絡' : (days + ' 天沒聯絡')}">N 天沒聯絡</span>
                                <span th:unless="${customer.lastContactedAt != null}" class="text-muted">尚無紀錄</span>
                            </td>
                        </tr>
                        <tr th:if="${customer.followUpEnabled}"><th class="text-muted">下次追蹤</th>
                            <td>
                                <span th:if="${customer.nextFollowUpDate != null}" class="fw-semibold"
                                      th:text="${#temporals.format(customer.nextFollowUpDate,'yyyy-MM-dd')}"></span>
                                <span th:unless="${customer.nextFollowUpDate != null}" class="text-muted"
                                      th:text="'依預設(超過 ' + ${reminderDays} + ' 天沒聯絡才提醒)'">依預設</span>
                            </td>
                        </tr>
                        <tr><th class="text-muted">建立 / 更新</th>
                            <td>
                                <span th:text="${#temporals.format(customer.createdAt,'yyyy-MM-dd HH:mm')}"></span> /
                                <span th:text="${#temporals.format(customer.updatedAt,'yyyy-MM-dd HH:mm')}"></span>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <!-- 聯絡人 + 歷史報價 -->
        <div class="col-lg-7">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i data-lucide="users"></i> 聯絡人</span>
                    <a class="btn btn-sm btn-primary" th:href="@{/contacts/new(customerId=${customer.id})}">
                        <i data-lucide="plus"></i> 新增聯絡人</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>姓名</th><th>部門/職稱</th><th>電話/分機</th><th>手機</th><th>Email</th><th class="text-end">操作</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="ct : ${contacts}">
                            <td>
                                <span th:text="${ct.name}">王小明</span>
                                <span th:if="${ct.primaryContact}" class="badge text-bg-warning">主要</span>
                            </td>
                            <td>
                                <span th:text="${ct.department}"></span>
                                <span th:if="${ct.jobTitle}" th:text="'/ ' + ${ct.jobTitle}"></span>
                            </td>
                            <td>
                                <span th:text="${ct.phone}"></span>
                                <span th:if="${ct.extensionNumber}" th:text="'#' + ${ct.extensionNumber}"></span>
                            </td>
                            <td th:text="${ct.mobile}"></td>
                            <td th:text="${ct.email}"></td>
                            <td class="text-end text-nowrap">
                                <form th:unless="${ct.primaryContact}" method="post" class="d-inline"
                                      th:action="@{/contacts/{id}/set-primary(id=${ct.id})}">
                                    <input type="hidden" name="customerId" th:value="${customer.id}">
                                    <button class="btn btn-sm btn-outline-warning" type="submit" title="設為主要">
                                        <i data-lucide="star"></i></button>
                                </form>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/contacts/{id}/edit(id=${ct.id})}">
                                    <i data-lucide="pencil"></i></a>
                                <form method="post" class="d-inline confirm-action"
                                      data-confirm-message="確定要刪除此聯絡人嗎?"
                                      th:action="@{/contacts/{id}/delete(id=${ct.id})}">
                                    <input type="hidden" name="customerId" th:value="${customer.id}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        <i data-lucide="trash-2"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contacts)}">
                            <td colspan="6" class="text-center text-muted py-3">尚未新增聯絡人</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 歷史報價單 -->
            <div class="card mb-3">
                <div class="card-header"><i data-lucide="file-text"></i> 歷史報價單</div>
                <div class="card-body">
                    <div th:replace="~{customers/quotation-history :: history}">
                        <p class="text-muted mb-0">尚無報價紀錄。</p>
                    </div>
                </div>
            </div>

            <!-- 聯絡 / 通知紀錄 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i data-lucide="notebook-text"></i> 聯絡 / 通知紀錄</span>
                    <a class="btn btn-sm btn-success" th:href="@{/notifications(customerId=${customer.id})}">
                        <i data-lucide="plus"></i> 記錄通知</a>
                </div>
                <!-- 類別標籤(前端即時篩選) -->
                <div class="px-3 pt-2 pb-1">
                    <div class="btn-group btn-group-sm log-tabs" role="group">
                        <button type="button" class="btn btn-primary" data-type="">全部</button>
                        <button type="button" class="btn btn-outline-secondary" data-type="EMAIL">Email</button>
                        <button type="button" class="btn btn-outline-secondary" data-type="PHONE">電話</button>
                        <button type="button" class="btn btn-outline-secondary" data-type="MEETING">拜訪 / 會議</button>
                        <button type="button" class="btn btn-outline-secondary" data-type="QUOTE">寄報價單</button>
                        <button type="button" class="btn btn-outline-secondary" data-type="OTHER">其他</button>
                    </div>
                </div>
                <ul class="list-group list-group-flush" id="contactLogList">
                    <li class="list-group-item d-flex justify-content-between align-items-center gap-2 log-row"
                        th:each="log : ${contactLogs}" th:attr="data-type=${log.type.name()}">
                        <span>
                            <span class="text-muted small" th:text="${#temporals.format(log.logDate,'yyyy-MM-dd')}">2026-07-23</span>
                            <span class="badge text-bg-light border" th:text="${log.type.label}">Email</span>
                            <span th:if="${log.note}" th:text="${log.note}"></span>
                        </span>
                        <form method="post" class="confirm-action" data-confirm-message="確定刪除這筆聯絡紀錄?"
                              th:action="@{/notifications/log/{id}/delete(id=${log.id})}">
                            <input type="hidden" name="redirect" th:value="@{/customers/{id}(id=${customer.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="刪除">
                                <i data-lucide="trash-2"></i></button>
                        </form>
                    </li>
                    <li class="list-group-item text-center text-muted py-3" th:if="${#lists.isEmpty(contactLogs)}">
                        尚無聯絡紀錄
                    </li>
                    <li class="list-group-item text-center text-muted py-3 log-empty-filtered" style="display:none">
                        此類別沒有紀錄
                    </li>
                </ul>
            </div>
            <script>
                document.querySelectorAll('.log-tabs button').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var type = btn.getAttribute('data-type');
                        document.querySelectorAll('.log-tabs button').forEach(function (b) {
                            b.className = 'btn btn-outline-secondary';
                        });
                        btn.className = 'btn btn-primary';
                        var shown = 0;
                        document.querySelectorAll('#contactLogList .log-row').forEach(function (row) {
                            var match = (type === '' || row.getAttribute('data-type') === type);
                            row.classList.toggle('log-hidden', !match);
                            if (match) shown++;
                        });
                        var ef = document.querySelector('.log-empty-filtered');
                        if (ef) ef.style.display = (shown === 0) ? '' : 'none';
                    });
                });
            </script>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
