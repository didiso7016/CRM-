<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('系統設定')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4" style="max-width: 960px;">
    <h4 class="mb-3"><i class="bi bi-sliders"></i> 系統設定</h4>

    <div class="row g-3">
        <!-- 公司資料與預設值 -->
        <div class="col-lg-7">
            <form method="post" th:action="@{/settings}" th:object="${settingsForm}" enctype="multipart/form-data">
                <div class="card card-body">
                    <div class="form-section-title">公司資訊(顯示於報價單抬頭)</div>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label required">公司名稱</label>
                            <input class="form-control" th:field="*{companyName}"
                                   th:classappend="${#fields.hasErrors('companyName')}?'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">統一編號</label>
                            <input class="form-control" th:field="*{taxId}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">公司地址</label>
                            <input class="form-control" th:field="*{address}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">電話</label>
                            <input class="form-control" th:field="*{phone}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">傳真</label>
                            <input class="form-control" th:field="*{fax}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')}?'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">業務聯絡人</label>
                            <input class="form-control" th:field="*{contactName}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">公司 Logo</label>
                            <input type="file" class="form-control" name="logoFile" accept="image/*">
                            <div class="mt-2" th:if="${currentLogo}">
                                <img th:src="@{/uploads/{f}(f=${currentLogo})}" alt="logo" style="max-height:50px;">
                                <span class="text-muted small">目前 Logo</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-section-title">報價單預設值</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">預設幣別</label>
                            <select class="form-select" th:field="*{defaultCurrency}">
                                <option th:each="c : ${currencyOptions}" th:value="${c}" th:text="${c}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">預設稅率(%)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{defaultTaxRate}"
                                   th:classappend="${#fields.hasErrors('defaultTaxRate')}?'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('defaultTaxRate')}" th:errors="*{defaultTaxRate}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">客戶未聯絡提醒(天)</label>
                            <input type="number" min="1" class="form-control" th:field="*{contactReminderDays}"
                                   th:classappend="${#fields.hasErrors('contactReminderDays')}?'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactReminderDays')}" th:errors="*{contactReminderDays}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">報價跟進提醒(天)</label>
                            <input type="number" min="1" class="form-control" th:field="*{quotationFollowupDays}"
                                   th:classappend="${#fields.hasErrors('quotationFollowupDays')}?'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('quotationFollowupDays')}" th:errors="*{quotationFollowupDays}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">預設付款條件</label>
                            <input class="form-control" th:field="*{defaultPaymentTerms}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">預設交貨條件</label>
                            <input class="form-control" th:field="*{defaultDeliveryTerms}">
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 儲存設定</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 備份 -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header"><i class="bi bi-hdd"></i> 資料庫備份</div>
                <div class="card-body">
                    <p class="mb-1">最近備份:
                        <strong th:if="${lastBackup}" th:text="${lastBackup}">—</strong>
                        <span th:unless="${lastBackup}" class="text-muted">尚無備份</span>
                    </p>
                    <p class="text-muted small">備份位置:<span th:text="${backupDir}"></span></p>
                    <form method="post" th:action="@{/settings/backup}">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-download"></i> 立即備份
                        </button>
                    </form>
                    <p class="text-muted small mt-2 mb-1">系統自動保留最近 30 份備份。</p>

                    <div th:if="${!#lists.isEmpty(backupList)}" class="mt-2">
                        <div class="text-muted small mb-1">備份清單(新到舊):</div>
                        <ul class="list-group list-group-flush small" style="max-height:220px; overflow:auto;">
                            <li class="list-group-item px-0 py-1" th:each="b : ${backupList}" th:text="${b}"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header"><i class="bi bi-arrow-counterclockwise"></i> 還原說明</div>
                <div class="card-body small">
                    <p>還原資料庫請依下列步驟(避免誤操作,不在網頁直接執行):</p>
                    <ol class="mb-0">
                        <li>關閉本系統(關閉執行視窗)。</li>
                        <li>到 <code>backup</code> 資料夾,找到要還原的檔案。</li>
                        <li>將它複製到 <code>data</code> 資料夾,並更名為 <code>crm.db</code>(先備份現有的)。</li>
                        <li>重新執行 <code>start-crm.bat</code>。</li>
                    </ol>
                    <p class="mt-2 mb-0 text-muted">詳細步驟見專案根目錄的 <code>restore-guide.txt</code>。</p>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
