<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('首頁')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container-fluid py-4">
    <h4 class="mb-4"><i data-lucide="gauge"></i> 首頁 Dashboard</h4>

    <!-- 統計卡片 -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <a th:href="@{/customers}" class="text-decoration-none">
                <div class="card stat-card border-start border-4 border-primary">
                    <div class="card-body">
                        <div class="text-muted small">客戶總數(啟用)</div>
                        <div class="fs-3 fw-bold text-dark" th:text="${stats.customerCount}">0</div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-start border-4 border-success">
                <div class="card-body">
                    <div class="text-muted small">本月報價單</div>
                    <div class="fs-3 fw-bold" th:text="${stats.monthlyQuotationCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-start border-4 border-warning">
                <div class="card-body">
                    <div class="text-muted small">報價中</div>
                    <div class="fs-3 fw-bold" th:text="${stats.inProgressCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card border-start border-4 border-info">
                <div class="card-body">
                    <div class="text-muted small">已接受</div>
                    <div class="fs-3 fw-bold" th:text="${stats.acceptedCount}">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 快速按鈕 -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-primary" th:href="@{/customers/new}"><i data-lucide="user-plus"></i> 新增客戶</a>
        <a class="btn btn-success" th:href="@{/quotations/new}"><i data-lucide="plus"></i> 新增報價單</a>
        <a class="btn btn-outline-secondary" th:href="@{/customers}"><i data-lucide="users"></i> 查看所有客戶</a>
        <a class="btn btn-outline-secondary" th:href="@{/quotations}"><i data-lucide="file-text"></i> 查看所有報價單</a>
    </div>

    <!-- ===== 圖表:營運概況 ===== -->
    <div class="row g-3 mb-4">
        <div class="col-lg-5">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="bar-chart-3"></i> 近 6 個月成交營業額</div>
                <div class="card-body">
                    <div class="bar-chart">
                        <div class="bar-col" th:each="b : ${stats.monthlyRevenue}">
                            <div class="bar-track">
                                <div class="bar-fill" th:style="'height:' + ${b.pct} + '%'"
                                     th:title="${b.label} + ':' + ${#numbers.formatDecimal(b.value,1,'COMMA',0,'POINT')}"></div>
                            </div>
                            <div class="bar-label" th:text="${b.label}">1月</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-3">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="target"></i> 報價成交率</div>
                <div class="card-body text-center">
                    <svg class="donut" viewBox="0 0 42 42" aria-label="成交率">
                        <circle class="donut-bg" cx="21" cy="21" r="15.915"></circle>
                        <circle class="donut-val" cx="21" cy="21" r="15.915"
                                th:attr="stroke-dasharray=${stats.winRatePercent + ' ' + (100 - stats.winRatePercent)}"></circle>
                        <text x="21" y="21" class="donut-text" th:text="${stats.winRatePercent} + '%'">0%</text>
                    </svg>
                    <div class="text-muted small mt-2">
                        成交 <span class="fw-bold" style="color:var(--green-ink)" th:text="${stats.wonCount}">0</span> ·
                        未成交 <span class="fw-bold" th:text="${stats.lostCount}">0</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="trophy"></i> 成交金額 Top 客戶</div>
                <div class="card-body">
                    <div class="hbar" th:each="b : ${stats.topCustomers}">
                        <div class="hbar-label" th:text="${b.label}" th:title="${b.label}">客戶</div>
                        <div class="hbar-track"><div class="hbar-fill" th:style="'width:' + ${b.pct} + '%'"></div></div>
                        <div class="hbar-val" th:text="${#numbers.formatDecimal(b.value,1,'COMMA',0,'POINT')}">0</div>
                    </div>
                    <div th:if="${#lists.isEmpty(stats.topCustomers)}" class="text-muted small py-3 text-center">
                        尚無成交資料
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 客戶關懷提醒:超過 N 天未聯絡 -->
    <div class="card mb-4 border-danger" th:if="${!#lists.isEmpty(stats.followUpCustomers)}">
        <div class="card-header bg-danger-subtle">
            <i data-lucide="bell" class="text-danger"></i>
            <strong>客戶關懷提醒</strong>
            — 以下客戶已超過 <span th:text="${stats.reminderDays}">30</span> 天未聯絡
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>客戶編號</th><th>公司名稱</th><th>最後聯絡</th><th>已間隔</th><th class="text-end">操作</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${stats.followUpCustomers}">
                    <td th:text="${c.customerCode}"></td>
                    <td><a th:href="@{/customers/{id}(id=${c.id})}" th:text="${c.companyName}"></a></td>
                    <td>
                        <span th:if="${c.lastContactedAt != null}"
                              th:text="${#temporals.format(c.lastContactedAt,'yyyy-MM-dd')}"></span>
                        <span th:unless="${c.lastContactedAt != null}" class="text-muted">從未聯絡</span>
                    </td>
                    <td>
                        <span th:if="${c.lastContactedAt != null}" class="text-danger"
                              th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(c.lastContactedAt, T(java.time.LocalDateTime).now())} + ' 天'"></span>
                        <span th:unless="${c.lastContactedAt != null}" class="text-danger">—</span>
                    </td>
                    <td class="text-end">
                        <form method="post" th:action="@{/customers/{id}/record-contact(id=${c.id})}" class="d-inline">
                            <button class="btn btn-sm btn-outline-success" type="submit">
                                <i data-lucide="phone-outgoing"></i> 記錄聯絡</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row g-3">
        <!-- 最近建立的報價單 -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="history"></i> 最近建立的報價單</div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>報價單號</th><th>客戶</th><th>狀態</th><th class="text-end amount">含稅總計</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="q : ${stats.recentQuotations}">
                            <td><a th:href="@{/quotations/{id}(id=${q.id})}"
                                   th:text="${q.quotationNumber} + ' v' + ${q.version}"></a></td>
                            <td th:text="${q.customer.companyName}"></td>
                            <td><span th:replace="~{fragments/status :: badge(${q.status})}"></span></td>
                            <td class="text-end amount" th:text="${#numbers.formatDecimal(q.totalAmount,1,'COMMA',0,'POINT')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(stats.recentQuotations)}">
                            <td colspan="4" class="text-center text-muted py-3">尚無報價單</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 即將到期的報價單 -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="hourglass"></i> 即將到期的報價單(7 天內)</div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>報價單號</th><th>客戶</th><th>有效期限</th><th>狀態</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="q : ${stats.expiringQuotations}">
                            <td><a th:href="@{/quotations/{id}(id=${q.id})}" th:text="${q.quotationNumber}"></a></td>
                            <td th:text="${q.customer.companyName}"></td>
                            <td class="text-danger" th:text="${#temporals.format(q.validUntil,'yyyy-MM-dd')}"></td>
                            <td><span th:replace="~{fragments/status :: badge(${q.status})}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(stats.expiringQuotations)}">
                            <td colspan="4" class="text-center text-muted py-3">近期無到期報價單</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 最近更新的客戶 -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header"><i data-lucide="users"></i> 最近更新的客戶</div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>客戶編號</th><th>公司名稱</th><th>更新時間</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${stats.recentlyUpdatedCustomers}">
                            <td th:text="${c.customerCode}"></td>
                            <td><a th:href="@{/customers/{id}(id=${c.id})}" th:text="${c.companyName}"></a></td>
                            <td th:text="${#temporals.format(c.updatedAt,'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(stats.recentlyUpdatedCustomers)}">
                            <td colspan="3" class="text-center text-muted py-3">尚無客戶</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
