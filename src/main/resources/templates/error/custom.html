<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('發生錯誤')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-5" style="max-width: 640px;">
    <div class="card border-danger">
        <div class="card-body text-center py-5">
            <i data-lucide="triangle-alert" class="text-danger" style="font-size: 3rem;"></i>
            <h4 class="mt-3" th:text="${errorTitle} ?: '發生錯誤'">發生錯誤</h4>
            <p class="text-muted" th:text="${errorMessage} ?: '請稍後再試'">錯誤訊息</p>
            <a class="btn btn-primary" th:href="@{/}"><i data-lucide="house"></i> 回首頁</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
