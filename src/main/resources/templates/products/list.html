<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('產品列表')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i data-lucide="cog"></i> 產品列表</h4>
        <a class="btn btn-primary" th:href="@{/products/new}"><i data-lucide="plus"></i> 新增產品</a>
    </div>

    <form class="card card-body mb-3" method="get" th:action="@{/products}">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label small text-muted">關鍵字(內部料號 / 客戶料號 / 名稱)</label>
                <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="輸入料號或名稱">
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="activeOnly" value="true"
                           id="activeOnly" th:checked="${activeOnly}">
                    <label class="form-check-label" for="activeOnly">只顯示啟用中</label>
                </div>
            </div>
            <div class="col-md-3 text-end">
                <button class="btn btn-outline-primary" type="submit"><i data-lucide="search"></i> 搜尋</button>
                <a class="btn btn-outline-secondary" th:href="@{/products}">清除</a>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>內部料號</th><th>客戶料號</th><th>名稱</th><th>規格</th>
                    <th>材質</th><th>單位</th><th class="text-end amount">預設單價</th>
                    <th>狀態</th><th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td class="fw-semibold" th:text="${p.internalPartNumber}"></td>
                    <td th:text="${p.customerPartNumber}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.specification}"></td>
                    <td th:text="${p.material}"></td>
                    <td th:text="${p.unit}"></td>
                    <td class="text-end amount"
                        th:text="${p.defaultUnitPrice != null ? #numbers.formatDecimal(p.defaultUnitPrice,1,'COMMA',2,'POINT') : '0.00'}"></td>
                    <td>
                        <span th:if="${p.active}" class="badge text-bg-success">啟用</span>
                        <span th:unless="${p.active}" class="badge text-bg-secondary">停用</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/products/{id}(id=${p.id})}"
                           title="詳細 / 歷史報價"><i data-lucide="eye"></i></a>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}/edit(id=${p.id})}">
                            <i data-lucide="pencil"></i></a>
                        <form th:if="${p.active}" method="post" class="d-inline confirm-action"
                              data-confirm-message="確定要停用此產品嗎?"
                              th:action="@{/products/{id}/deactivate(id=${p.id})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i data-lucide="circle-slash"></i></button>
                        </form>
                        <form th:unless="${p.active}" method="post" class="d-inline"
                              th:action="@{/products/{id}/activate(id=${p.id})}">
                            <button class="btn btn-sm btn-outline-success" type="submit"><i data-lucide="circle-check"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="9" class="text-center text-muted py-4">查無產品資料</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- 分頁 -->
    <nav class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <form method="get" th:action="@{/products}" class="d-flex align-items-center gap-2">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="activeOnly" th:value="${activeOnly}">
            <span class="text-muted small">共 <span th:text="${page.totalElements}">0</span> 筆</span>
            <label class="text-muted small mb-0">每頁</label>
            <select class="form-select form-select-sm" style="width:auto" name="size" onchange="this.form.submit()">
                <option value="10" th:selected="${pageSize==10}">10</option>
                <option value="20" th:selected="${pageSize==20}">20</option>
                <option value="50" th:selected="${pageSize==50}">50</option>
            </select>
        </form>
        <ul class="pagination pagination-sm mb-0" th:if="${page.totalPages > 1}">
            <li class="page-item" th:classappend="${page.first}?'disabled'">
                <a class="page-link" th:href="@{/products(page=${page.number-1},size=${pageSize},keyword=${keyword},activeOnly=${activeOnly})}">上一頁</a>
            </li>
            <li class="page-item disabled"><span class="page-link"
                th:text="'第 ' + (${page.number+1}) + ' / ' + ${page.totalPages} + ' 頁'">第 1 頁</span></li>
            <li class="page-item" th:classappend="${page.last}?'disabled'">
                <a class="page-link" th:href="@{/products(page=${page.number+1},size=${pageSize},keyword=${keyword},activeOnly=${activeOnly})}">下一頁</a>
            </li>
        </ul>
    </nav>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
