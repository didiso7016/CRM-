<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<!--
  共用版型片段:head / sidebar(nav)/ flash / scripts。
  各頁面以 th:replace 套用,維持一致外觀且避免重複程式碼。
-->

<!-- ===== HEAD ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - EnviroValor 報價系統'">EnviroValor 報價系統</title>
    <!-- 主題初始化(避免載入閃爍):優先用儲存值,否則跟隨系統 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('crm-theme');
                if (!t) { t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'; }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- ===== 左側欄(片段名沿用 nav,各頁不需改)===== -->
<aside th:fragment="nav" class="app-side no-print">
    <a class="app-brand" th:href="@{/}">
        <img th:src="@{/img/logo-mark.jpg}" alt="EnviroValor">
        <span><b>EnviroValor</b><small>報價管理系統</small></span>
    </a>

    <div class="app-nav-label">主功能</div>
    <a class="app-nav-link" th:classappend="${activeMenu=='home'}?'active'" th:href="@{/}">
        <i data-lucide="layout-dashboard"></i> 首頁
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='customers'}?'active'" th:href="@{/customers}">
        <i data-lucide="users"></i> 客戶
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='products'}?'active'" th:href="@{/products}">
        <i data-lucide="cog"></i> 零件
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='quotations'}?'active'" th:href="@{/quotations}">
        <i data-lucide="file-text"></i> 報價單
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='notifications'}?'active'" th:href="@{/notifications}">
        <i data-lucide="bell"></i> 通知
        <span class="nav-count" th:if="${navNotificationCount != null and navNotificationCount > 0}"
              th:text="${navNotificationCount}">0</span>
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='tasks'}?'active'" th:href="@{/tasks}">
        <i data-lucide="check-square"></i> 待辦
        <span class="nav-count" th:if="${navOverdueTasks != null and navOverdueTasks > 0}"
              th:text="${navOverdueTasks}">0</span>
    </a>
    <a class="app-nav-link" th:classappend="${activeMenu=='settings'}?'active'" th:href="@{/settings}">
        <i data-lucide="sliders-horizontal"></i> 設定
    </a>

    <div class="app-side-foot">
        <button type="button" class="theme-toggle" onclick="toggleTheme()">
            <i data-lucide="sun-moon"></i> 深色 / 淺色
        </button>
        <div class="meta">單機版 · 本機執行<br>127.0.0.1:8080</div>
    </div>
</aside>

<!-- ===== 全域訊息(浮動 toast,不擠壓頁面內容)===== -->
<div th:fragment="flash" class="no-print flash-toast-wrap">
    <div th:if="${flashSuccess}" class="flash-toast flash-success" role="alert">
        <i data-lucide="circle-check"></i>
        <span th:text="${flashSuccess}"></span>
        <button type="button" class="flash-x" onclick="this.parentElement.remove()" aria-label="關閉">&times;</button>
    </div>
    <div th:if="${flashError}" class="flash-toast flash-error" role="alert">
        <i data-lucide="triangle-alert"></i>
        <span th:text="${flashError}"></span>
        <button type="button" class="flash-x" onclick="this.parentElement.remove()" aria-label="關閉">&times;</button>
    </div>
</div>

<!-- ===== 共用 JS ===== -->
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script>if (window.lucide) { lucide.createIcons(); }</script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/autocomplete.js}"></script>
</th:block>

</body>
</html>
