<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 報價狀態標籤:傳入 QuotationStatus,依 badgeClass 顯示不同樣式 -->
<span th:fragment="badge(status)" class="badge"
      th:classappend="${status != null ? status.badgeClass : 'text-bg-secondary'}"
      th:text="${status != null ? status.label : ''}">狀態</span>
</body>
</html>
