<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 報價狀態徽章:顏色 + 圖示 + 文字 三重標示(色盲友善)。傳入 QuotationStatus。 -->
<span th:fragment="badge(status)" class="qbadge"
      th:classappend="'qbadge-' + ${status != null ? status.name() : 'DRAFT'}">
    <i th:attr="data-lucide=${status != null ? status.icon : 'pencil'}"></i>
    <span th:text="${status != null ? status.label : ''}">狀態</span>
</span>
</body>
</html>
