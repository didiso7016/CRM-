spring.application.name=crm

# ===== 地端安全:僅監聽本機 =====
server.address=127.0.0.1
server.port=8080

# ===== SQLite 資料庫(放在專案外部的 data 資料夾,已 gitignore) =====
spring.datasource.url=jdbc:sqlite:data/crm.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 為單一檔案資料庫,單人使用限制連線數為 1,避免資料庫鎖定
spring.datasource.hikari.maximum-pool-size=1
# 每條連線啟用外鍵約束
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== 檔案上傳(公司 Logo) =====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== 語系與日期格式 =====
spring.web.locale=zh_TW
spring.web.locale-resolver=fixed
spring.mvc.format.date=yyyy-MM-dd

# ===== Log:不輸出 SQL 參數,避免記錄客戶敏感資料 =====
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
